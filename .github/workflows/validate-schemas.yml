name: Validate Data

on:
  push:
    branches: [main]
    # The checksum bot's commits only touch data/sha/; nothing to validate.
    paths-ignore:
      - "data/sha/**"
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run Schema & Data Checks
        run: npm run test:validate
